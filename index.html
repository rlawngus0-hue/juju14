<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Powerball 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Powerball 번호 생성기</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                🌙
            </button>
        </header>
        <main>
            <div class="lotto-container">
                <div id="lotto-numbers" class="lotto-numbers">
                    <!-- Numbers will be generated here -->
                </div>
                <button id="generate-btn" class="generate-btn">
                    번호 생성
                </button>
            </div>

            <section class="partnership-container">
                <h2>제휴 문의</h2>
                <form action="https://formspree.io/f/xeelllva" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="email">이메일 주소</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" rows="4" placeholder="제휴 관련 문의 내용을 입력해주세요." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">문의하기</button>
                </form>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
