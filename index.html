<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? - 저녁 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>오늘 뭐 먹지? 🍽️</h1>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                🌙
            </button>
        </header>
        <main>
            <div class="menu-container">
                <div id="menu-display" class="menu-display">
                    <p class="placeholder-text">버튼을 눌러 메뉴를 골라보세요!</p>
                </div>
                <button id="recommend-btn" class="recommend-btn">
                    저녁 메뉴 추천받기
                </button>
            </div>

            <section class="partnership-container">
                <h2>제휴 문의</h2>
                <form action="https://formspree.io/f/xeelllva" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="email">이메일 주소</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">문의 내용</label>
                        <textarea id="message" name="message" rows="4" placeholder="제휴 관련 문의 내용을 입력해주세요." required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">문의하기</button>
                </form>
            </section>

            <section class="comments-container">
                <h2>의견 나누기</h2>
                <div id="disqus_thread"></div>
                <noscript>댓글을 보려면 JavaScript를 활성화해주세요.</noscript>
            </section>
        </main>
    </div>
    <script src="main.js"></script>
</body>
</html>
